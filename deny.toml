[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
# Scope of crates checked for RUSTSEC-*-unmaintained advisories.
# cargo-deny 0.17+ emits unmaintained as a warning by default; this
# controls which crates are inspected. "all" preserves warn-on-unmaintained.
unmaintained = "all"
yanked = "warn"
ignore = [
    # zvariant_derive advisory — transitive via rfd -> ashpd -> zbus. No safe upgrade
    # until rfd ships a zbus-6 compatible release. Revisit when rfd > 0.15 lands.
    "RUSTSEC-2024-0421",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
]
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "allow"
wildcards = "warn"
highlight = "all"
deny = [
    { name = "openssl" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
