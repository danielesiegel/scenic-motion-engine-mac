[package]
name = "scenic-motion-engine"
version = "0.1.0"
edition = "2021"
authors = ["Daniel Siegel <daniel@integralmimetics.com>"]
description = "Native Mac audio-reactive marquee: four-band transient detection drives per-row scrolling, camera zoom/tilt/pan, spotlight repetition. GPU text via glyphon, egui control panel, cpal/symphonia audio, ffmpeg-pipe MP4 export."
license = "MIT"
repository = "https://github.com/danielesiegel/scenic-motion-engine-mac"
default-run = "scenic-motion-engine"

[profile.dev]
opt-level = 1              # text layout + wgpu are miserable at opt-level 0

[profile.dev.package."*"]
opt-level = 3              # heavy deps (cosmic-text, glyphon, naga) always optimized

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# --- GUI + GPU ---
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = "0.29"
egui-wgpu = "0.29"
wgpu = { version = "22", features = ["metal"] }
winit = "0.30"
pollster = "0.4"

# --- Text ---
cosmic-text = "0.12"
glyphon = "0.6"

# --- Audio ---
cpal = "0.15"
symphonia = { version = "0.5", features = ["wav", "pcm", "mp3", "flac"] }
rtrb = "0.3"                                             # lock-free audio ring
midir = "0.10"                                           # cross-platform MIDI (CoreMIDI on macOS)

# --- Core ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
glam = { version = "0.34", features = ["serde"] }
rayon = "1.10"
parking_lot = "0.12"
once_cell = "1.19"
smallvec = "1.13"
log = "0.4"
env_logger = "0.11"
rfd = "0.15"                                             # native file dialogs
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png"] }

# --- Export ---
# ffmpeg is spawned as a subprocess. Keeps the build simple and portable.
# A future native encoder path can use `openh264` or `ffmpeg-next` bindings.

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
tempfile = "3"

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "text_layout"
harness = false

[[bin]]
name = "render"
path = "src/bin/render.rs"
