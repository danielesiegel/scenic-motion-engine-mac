name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: scenic-motion-engine
  APP_NAME: scenic-motion-engine.app

jobs:
  macos-universal:
    name: Build universal macOS binary
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create -output "dist/${BIN_NAME}" \
            "target/aarch64-apple-darwin/release/${BIN_NAME}" \
            "target/x86_64-apple-darwin/release/${BIN_NAME}"
          lipo -info "dist/${BIN_NAME}"
          chmod +x "dist/${BIN_NAME}"

      - name: Stage .app bundle (if present)
        id: stage_app
        run: |
          set -euo pipefail
          if [ -d "dist/${APP_NAME}" ]; then
            # Replace the inner Mach-O with the universal one if present.
            if [ -f "dist/${APP_NAME}/Contents/MacOS/${BIN_NAME}" ]; then
              cp "dist/${BIN_NAME}" "dist/${APP_NAME}/Contents/MacOS/${BIN_NAME}"
            fi
            echo "app_present=true" >> "$GITHUB_OUTPUT"
            echo "app_path=dist/${APP_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "app_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple signing certificate
        if: ${{ steps.stage_app.outputs.app_present == 'true' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12_BASE64" ] || [ -z "$APPLE_CERT_P12_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "Skipping certificate import: signing credentials are not configured."
            exit 0
          fi
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Codesign .app
        if: ${{ steps.stage_app.outputs.app_present == 'true' }}
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APP_PATH: ${{ steps.stage_app.outputs.app_path }}
        run: |
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "Skipping codesign: signing identity is not configured."
            exit 0
          fi
          codesign --force --deep --timestamp --options runtime --sign "$SIGN_IDENTITY" "$APP_PATH"

      - name: Notarize
        if: ${{ steps.stage_app.outputs.app_present == 'true' }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APP_PATH: ${{ steps.stage_app.outputs.app_path }}
        run: |
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "Skipping notarization: API credentials are not configured."
            exit 0
          fi
          echo "$APPLE_API_KEY" | base64 --decode > /tmp/apikey.p8
          ditto -c -k --keepParent "$APP_PATH" "dist/${BIN_NAME}-notarize.zip"
          xcrun notarytool submit "dist/${BIN_NAME}-notarize.zip" \
            --key /tmp/apikey.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$APP_PATH"

      - name: Package .app (if present) or raw binary
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="${BIN_NAME}-${VERSION}-macos-universal.zip"

          # If a packaging step somewhere else produced a .app bundle in dist/, zip it.
          # Otherwise, zip the raw universal binary.
          if [ -d "dist/${APP_NAME}" ]; then
            (cd dist && zip -r -y "${ARCHIVE}" "${APP_NAME}")
          else
            (cd dist && zip -j "${ARCHIVE}" "${BIN_NAME}")
          fi

          echo "archive=dist/${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.archive }}
          generate_release_notes: true
          fail_on_unmatched_files: true
