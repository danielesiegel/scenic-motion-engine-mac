# Analyzer tuning presets for scenic-motion-engine.
#
# Each preset maps genre/tempo context to overrides for scripts/analyze.py
# flags. Values here are forwarded verbatim as `--<flag> <value>` on the
# command line. Only flags listed under `flags:` are passed; everything else
# uses analyze.py defaults.
#
# Available flags (see analyze.py argparse):
#   k-kick, k-snare, k-mid, k-hats          (MAD multiplier, adaptive thresh)
#   ref-kick, ref-snare, ref-mid, ref-hats  (refractory window, ms)
#   kick-lo, kick-hi, snare-lo, snare-hi,
#   mid-lo, mid-hi, hats-lo, hats-hi        (band edges, Hz)
#   snare-crack-lo, snare-crack-hi,
#   snare-body-w, snare-crack-w,
#   snare-inner-thresh                      (snare body/crack mix)
#   fps                                      (envelope sample rate)

presets:

  techno-128bpm:
    description: >
      Four-on-the-floor techno at ~128 BPM. Beat period ~469 ms, so refractory
      windows are kept short enough to catch 16th-note hats. Kick threshold
      slightly loose because the kick dominates the low end.
    flags:
      k-kick: 1.8
      k-snare: 2.2
      k-mid: 2.0
      k-hats: 1.4
      ref-kick: 90
      ref-snare: 80
      ref-mid: 50
      ref-hats: 25
      kick-lo: 40
      kick-hi: 140
      hats-lo: 7000
      hats-hi: 16000

  trap-150bpm:
    description: >
      Modern trap at ~150 BPM with 808 sub-kicks and fast hi-hat rolls (32nd
      and triplet patterns). Hats refractory is aggressive to avoid merging
      rolls; kick band extended low for 808s.
    flags:
      k-kick: 1.7
      k-snare: 2.0
      k-mid: 2.0
      k-hats: 1.2
      ref-kick: 100
      ref-snare: 90
      ref-mid: 60
      ref-hats: 15
      kick-lo: 25
      kick-hi: 120
      snare-lo: 180
      snare-hi: 500
      hats-lo: 8000
      hats-hi: 16000

  house-124bpm:
    description: >
      Classic house at ~124 BPM. Balanced thresholds, slightly broader snare
      body band to capture claps and rimshots.
    flags:
      k-kick: 1.9
      k-snare: 2.1
      k-mid: 2.0
      k-hats: 1.5
      ref-kick: 95
      ref-snare: 85
      ref-mid: 55
      ref-hats: 30
      kick-lo: 35
      kick-hi: 150
      snare-lo: 150
      snare-hi: 450

  dnb-174bpm:
    description: >
      Drum & bass at ~174 BPM. Very fast breaks, so refractory windows must
      be tight. Snare crack weight raised because amen-style snares live in
      the 2-5 kHz range.
    flags:
      k-kick: 1.8
      k-snare: 1.9
      k-mid: 2.0
      k-hats: 1.3
      ref-kick: 70
      ref-snare: 60
      ref-mid: 45
      ref-hats: 20
      kick-lo: 40
      kick-hi: 160
      snare-crack-lo: 2000
      snare-crack-hi: 5500
      snare-body-w: 0.45
      snare-crack-w: 0.55

  ambient-sparse:
    description: >
      Beatless / sparse ambient. No tempo assumption. Thresholds are high so
      only clear onsets fire; refractory windows are long because events are
      rare and we want to avoid tremolo-driven false positives.
    flags:
      k-kick: 3.0
      k-snare: 3.0
      k-mid: 2.8
      k-hats: 2.5
      ref-kick: 250
      ref-snare: 250
      ref-mid: 200
      ref-hats: 150

  rock-live:
    description: >
      Live rock recording with bleed and dynamic kit. Kick band widened to
      survive bleed, snare body weighted higher than crack (live snares often
      have less sizzle than studio ones), moderate refractory windows.
    flags:
      k-kick: 2.1
      k-snare: 2.0
      k-mid: 2.2
      k-hats: 1.7
      ref-kick: 110
      ref-snare: 95
      ref-mid: 60
      ref-hats: 35
      kick-lo: 40
      kick-hi: 180
      snare-lo: 160
      snare-hi: 420
      snare-body-w: 0.7
      snare-crack-w: 0.3

  hip-hop-boom-bap:
    description: >
      Sampled boom-bap hip-hop (~85-95 BPM). Punchy filtered kicks, dusty
      snares around 200 Hz with lots of body. Longer refractories match the
      slower tempo; mid band is a touch tighter to not fire on vocals.
    flags:
      k-kick: 1.9
      k-snare: 2.0
      k-mid: 2.3
      k-hats: 1.6
      ref-kick: 130
      ref-snare: 110
      ref-mid: 70
      ref-hats: 40
      kick-lo: 35
      kick-hi: 140
      snare-lo: 180
      snare-hi: 400
      snare-body-w: 0.65
      snare-crack-w: 0.35
